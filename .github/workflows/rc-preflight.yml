name: RC preflight

# Maintainer gate before tagging 1.0.0-rc.N — runs scripts/rc-preflight.mjs.
# Does not publish or tag anything.

on:
  workflow_dispatch:
    inputs:
      skip_slow:
        description: Skip playground worker bundle (faster)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    name: RC automated gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: cd superjs && bun install --frozen-lockfile

      - name: Build compiler (playground worker check)
        if: ${{ !inputs.skip_slow }}
        run: cd superjs && bunx nx build compiler

      - name: Run RC preflight
        run: |
          ARGS=""
          if [ "${{ inputs.skip_slow }}" = "true" ]; then ARGS="--skip-slow"; fi
          node scripts/rc-preflight.mjs $ARGS
